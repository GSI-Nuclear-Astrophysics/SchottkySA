[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SchottkySA"
dynamic = ["version"]
description = "Empirical-template peak fitting for Schottky spectra, with a Qt GUI."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "David Freire Fernández", email = "D.FreireFernandez@gsi.de" },
]
keywords = [
    "schottky",
    "spectroscopy",
    "peak-fitting",
    "template-fitting",
    "uncertainty-quantification",
    "physics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gui = [
    # 6.12.0 Linux wheels corrupt None's reference count on void Qt calls.
    "PySide6>=6.5,!=6.12.0",
    "pyqtgraph>=0.13",
]
xlsx = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "odfpy>=1.4",
]
all = [
    "SchottkySA[gui,xlsx]",
]
dev = [
    "SchottkySA[gui,xlsx]",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.1",
    # Required by the Python 3.10 type-check target.
    "tomli>=2.0",
]

[project.urls]
Homepage = "https://github.com/GSI-Nuclear-Astrophysics/SchottkySA"
Issues = "https://github.com/GSI-Nuclear-Astrophysics/SchottkySA/issues"
Documentation = "https://github.com/GSI-Nuclear-Astrophysics/SchottkySA/tree/main/docs"

[project.scripts]
ssa = "ssa.cli:main"

[tool.hatch.version]
path = "src/ssa/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ssa"]

[tool.hatch.build.targets.sdist]
# Keep source distributions limited to public code, fixtures and documentation.
include = [
    "/src/ssa",
    "/tests",
    "/examples",
    "/docs/SCIENTIFIC_METHOD.md",
    "/docs/REPRODUCIBILITY.md",
    "/docs/PROFILE_WORKBENCH.md",
    "/docs/RELEASE.md",
    "/docs/index.md",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/.zenodo.json",
    "/scripts/check_release.py",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = [
    "E501",  # line length is enforced by the formatter, not lint, where it matters
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.ruff.lint.isort]
known-first-party = ["ssa"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = true

# Limit Qt-stub relaxations to GUI modules.
[[tool.pyright.executionEnvironments]]
root = "src/ssa/gui"
reportOptionalMemberAccess = false
reportAttributeAccessIssue = false
reportCallIssue = false
reportOperatorIssue = false
reportArgumentType = false
