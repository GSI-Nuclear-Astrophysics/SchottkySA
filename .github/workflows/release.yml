name: Publish reviewed distributions

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to upload this version to PyPI.
        required: true
        type: string
      target:
        description: Package index
        type: choice
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check publishing request
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        run: test "$RELEASE_CONFIRM" = publish
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      - name: Install build and test dependencies
        run: python -m pip install '.[dev]' build twine
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          PYQTGRAPH_QT_LIB: PySide6
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/check_release.py dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      url: https://pypi.org/project/SchottkySA/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/
      - if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
      - if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
