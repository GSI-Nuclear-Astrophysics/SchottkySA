name: Release

# Publishes SchottkySA to PyPI using Trusted Publishing (OIDC) -- no PyPI
# API token is stored anywhere in this repo. The trusted-publisher binding
# on PyPI's side is scoped to exactly this repo + this workflow file +
# (for the real-PyPI job) the "pypi" GitHub Environment, so no other
# workflow or fork can mint a token that PyPI will accept.
#
# Two ways to run this:
#   - Publish a GitHub Release -> builds, re-runs the test suite, and
#     publishes to the real PyPI index.
#   - Run manually (workflow_dispatch) -> choose either TestPyPI for a dry run
#     or PyPI for a production upload.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Package index
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    name: Test (release gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: Install package (dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (pyright)
        run: pyright

      - name: Test (pytest)
        run: pytest

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-to-testpypi:
    name: Publish to TestPyPI (dry run)
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/SchottkySA/
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-to-pypi:
    name: Publish to PyPI
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/SchottkySA/
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  sign-and-attach:
    name: Sign distribution and attach to the GitHub release
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to upload release assets
      id-token: write # required for sigstore OIDC signing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Sign distribution with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: dist/*.tar.gz dist/*.whl

      - name: Attach distribution + signatures to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}"
