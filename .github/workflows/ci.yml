name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PySide6's "offscreen" platform plugin still needs a handful of
      # system libraries that ubuntu-latest doesn't ship by default.
      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: Install package (dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (pyright)
        run: pyright

      - name: Test (pytest)
        run: pytest

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distribution metadata (twine check)
        run: twine check dist/*

      - name: Install built wheel into a fresh venv and smoke test
        run: |
          python -m venv /tmp/fresh_venv
          source /tmp/fresh_venv/bin/activate
          pip install "$(ls dist/*.whl)[gui]"
          python -c "import ssa; import ssa.gui.main_window; print('ssa', ssa.__version__)"
          ssa --version
